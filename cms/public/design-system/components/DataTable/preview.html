<!-- @dsCard group="Data" height=580 subtitle="Navy header, zebra rows, numbers aligned to the trailing edge" -->
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Inter:wght@400;500;600&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  body { margin: 0; padding: 24px; background: var(--surface); font-family: var(--font-body-en); }
  .demo { display: grid; gap: 24px; }
  .row { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; }
  .split { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; align-items: start; }
  .note { font-size: 12px; line-height: 18px; color: var(--text-muted); font-family: var(--font-body-en); margin: 0; }
  .dark { background: var(--gradient-depth); border-radius: var(--radius-lg); padding: 24px; }
</style>
<div id="root"></div>
<script>
const { DataTable, Badge } = window.AlQawsan;
const h = React.createElement;
const columns = [
  { key: 'product', label: 'Product' },
  { key: 'batch', label: 'Batch' },
  { key: 'expiry', label: 'Expiry' },
  { key: 'units', label: 'Units', align: 'end' },
  { key: 'status', label: 'Status' }
];
const rows = [
  { product: 'Bioderma Atoderm 500ml', batch: 'BD-24815', expiry: '2027-04', units: '3,120', status: h(Badge, { tone: 'success' }, 'In stock') },
  { product: 'Avène Thermal Water 300ml', batch: 'AV-11290', expiry: '2026-11', units: '640', status: h(Badge, { tone: 'warning' }, 'Low stock') },
  { product: 'Ducray Anaphase+ 200ml', batch: 'DC-70551', expiry: '2028-01', units: '1,480', status: h(Badge, { tone: 'success' }, 'In stock') },
  { product: 'Paracetamol 500mg · 20 tab', batch: 'PR-33107', expiry: '2026-09', units: '0', status: h(Badge, { tone: 'danger' }, 'Recalled') }
];
const arColumns = [
  { key: 'product', label: 'المنتج' },
  { key: 'units', label: 'الوحدات', align: 'end' },
  { key: 'status', label: 'الحالة' }
];
const arRows = [
  { product: 'بيوديرما أتوديرم 500 مل', units: '3,120', status: h(Badge, { lang: 'ar', tone: 'success' }, 'متوفر') },
  { product: 'أفين ماء حراري 300 مل', units: '640', status: h(Badge, { lang: 'ar', tone: 'warning' }, 'مخزون منخفض') }
];
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', { className: 'demo' },
    h(DataTable, { columns: columns, rows: rows, caption: 'Central warehouse, Baghdad · stock as at 2026-09-20' }),
    h(DataTable, { lang: 'ar', columns: arColumns, rows: arRows, dense: true,
      caption: ['المستودع المركزي، بغداد · المخزون بتاريخ ', h('bdi', { dir: 'ltr', key: 'd' }, '2026-09-20')] })));
</script>
